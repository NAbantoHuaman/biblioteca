# ============================
# CONFIGURACIÓN DE LA APLICACIÓN
# Sistema de Gestión de Biblioteca Universitaria
# ============================

server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always

# ============================
# BASE DE DATOS - PostgreSQL
# ============================
spring:
  application:
    name: biblioteca-api

  datasource:
    url: jdbc:postgresql://localhost:5432/biblioteca_db
    username: postgres
    password: 1304
    driver-class-name: org.postgresql.Driver

  jpa:
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    open-in-view: false

  # Inicialización de datos
  sql:
    init:
      mode: always

  # DevTools
  devtools:
    restart:
      enabled: true
    livereload:
      enabled: true

# ============================
# CONFIGURACIÓN JWT
# ============================
jwt:
  secret: S3cr3tK3yBibl10t3c4Un1v3rs1t4r14IDAT2026MuySegura256BitsMinimo!!
  access-token-expiration: 900000       # 15 minutos en ms
  refresh-token-expiration: 604800000   # 7 días en ms

# ============================
# DOCUMENTACIÓN SWAGGER / OPENAPI
# ============================
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

# ============================
# LOGGING
# ============================
logging:
  level:
    pe.edu.idat.biblioteca: DEBUG
    org.springframework.security: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
